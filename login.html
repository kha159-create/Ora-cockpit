<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Orange Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="assets/sidebar.css">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--neutral-50, #f8fafc);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: var(--card-background, #fff);
            padding: 2rem;
            border-radius: var(--radius-2xl, 1.5rem);
            box-shadow: var(--shadow-xl, 0 20px 25px -5px rgb(0 0 0 / 0.1));
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--neutral-200, #e2e8f0);
        }
        .brand-text { color: var(--primary-600); font-weight: 800; }
        .btn-orange, .btn-primary {
            background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
            color: white;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-lg);
            padding: 0.75rem 1.5rem;
        }
        .btn-orange:hover, .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-600), #c2410c);
            color: white;
        }
    </style>
</head>

<body>

    <div class="login-card text-center">
        <h3 class="mb-4"><span class="brand-text">ORANGE</span> DASHBOARD</h3>

        <div class="mb-3 text-start">
            <label class="form-label fw-bold small text-muted">اسم المستخدم (User)</label>
            <select id="userSelect" class="form-select">
                <option value="" selected disabled>اختر المستخدم...</option>
                <!-- JS Populated -->
            </select>
        </div>

        <div class="mb-4 text-start">
            <label class="form-label fw-bold small text-muted">رمز الدخول (PIN)</label>
            <input type="password" id="pinInput" class="form-control" placeholder="****">
        </div>

        <button onclick="login()" class="btn-primary w-100 py-3">تسجيل الدخول</button>
        <div id="errorMsg" class="text-danger small mt-3 fw-bold" style="display: none;"></div>
    </div>

    <script src="users.js"></script>
    <script>
        // Populate Select
        const select = document.getElementById('userSelect');
        Object.keys(USERS).sort().forEach(user => {
            let opt = document.createElement('option');
            opt.value = user;
            opt.textContent = user;
            select.appendChild(opt);
        });

        function login() {
            const user = document.getElementById('userSelect').value;
            const pin = document.getElementById('pinInput').value;
            const errorDiv = document.getElementById('errorMsg');

            if (!user) {
                showError('الرجاء اختيار اسم المستخدم');
                return;
            }

            if (USERS[user] && USERS[user].pin === pin) {
                // Success
                const userData = {
                    name: user,
                    role: USERS[user].role
                };
                localStorage.setItem('currentUser', JSON.stringify(userData));

                if (userData.role === 'Auditor') {
                    window.location.href = 'data_audit.html';
                } else {
                    window.location.href = 'index.html';
                }
            } else {
                showError('رمز الدخول غير صحيح');
            }
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
        }

        // Enter Key Support
        document.getElementById('pinInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>

</html>
