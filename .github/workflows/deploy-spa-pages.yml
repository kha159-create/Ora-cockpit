name: Deploy SPA (gh-pages)

on:
  push:
    branches: [main]
    paths:
      - "spa/**"
      - ".github/workflows/deploy-spa-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "gh-pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "spa/package-lock.json"

      - name: Prepare PWA icons for SPA
        run: |
          mkdir -p spa/public
          cp -f icon-192.png spa/public/icon-192.png
          cp -f icon-512.png spa/public/icon-512.png

      - name: Install deps
        working-directory: spa
        run: npm ci

      - name: Build
        working-directory: spa
        run: npm run build

      - name: Disable Jekyll
        run: |
          touch spa/dist/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: spa/dist
          force_orphan: true
