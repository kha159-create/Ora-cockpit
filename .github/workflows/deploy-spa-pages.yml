name: Deploy SPA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "spa/**"
      - ".github/workflows/deploy-spa-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "spa/package-lock.json"

      - name: Prepare PWA icons for SPA
        run: |
          mkdir -p spa/public
          cp -f icon-192.png spa/public/icon-192.png
          cp -f icon-512.png spa/public/icon-512.png

      - name: Install deps
        working-directory: spa
        run: npm ci

      - name: Build
        working-directory: spa
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: spa/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

