# تحديث البيانات كل 15 دقيقة من الريبو الأصلي ALAAWF2/orange-dashboard
# نأخذ ملفات JSON من المصدر فقط - لا علاقة للملفات المحلية
name: Sync Data From Upstream Every 15 Min

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch JSON from ALAAWF2/orange-dashboard
        run: |
          BASE="https://raw.githubusercontent.com/ALAAWF2/orange-dashboard/main"
          for f in management_data.json employees_data.json product_analysis_data.json stagnant_data.json offers_data.json; do
            curl -sfL "$BASE/$f" -o "$f" 2>/dev/null && echo "OK: $f" || echo "Skip: $f"
          done

      - name: Commit and push if changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add management_data.json employees_data.json product_analysis_data.json stagnant_data.json offers_data.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: sync data from ALAAWF2/orange-dashboard [auto]" && git push origin main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
